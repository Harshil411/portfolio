name: Restore Virginia Tech portfolio content

on:
  schedule:
    # 20:00 Asia/Kolkata on August 20, 2026 is 14:30 UTC.
    - cron: "30 14 20 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install reportlab==5.0.0
      - run: python scripts/restore_virginia_tech.py
      - name: Commit and push the restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/Harshil_Agrawal_Resume.pdf app/templates/contact.html app/templates/index.html app/templates/resume.html scripts/generate_resume_pdf.py
          git rm .github/workflows/restore-virginia-tech.yml scripts/restore_virginia_tech.py
          git commit -m "Restore Virginia Tech portfolio content"
          git push
