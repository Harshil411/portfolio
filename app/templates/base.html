<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Harshil Agrawal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #faf9f7;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f4f2;
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-tertiary: #8a8a8a;
            --accent: #047857;
            --accent-hover: #065f46;
            --accent-light: #e7f3ee;
            --signal: #c2410c;
            --border: #e5e3e0;
            --border-light: #d4d2cf;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --radius: 0.25rem;
            --radius-lg: 0.5rem;
            --font-serif: 'IBM Plex Serif', Georgia, serif;
            --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'IBM Plex Mono', Monaco, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection { background: #cce8db; }

        .container {
            max-width: 72rem;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Navigation */
        nav {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 4rem;
        }

        .nav-brand {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.025em;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.2s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-toggle {
            display: none;
            color: var(--text-primary);
            background: none;
            border: 1px solid var(--border);
            padding: 0.4rem 0.6rem;
            font: 500 0.75rem var(--font-mono);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* Main content */
        main {
            padding: 3rem 0 5rem;
            min-height: calc(100vh - 4rem - 8rem);
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-serif);
            font-weight: 600;
            line-height: 1.2;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        h1 { font-size: 3rem; }
        h2 { font-size: 1.875rem; }
        h3 { font-size: 1.25rem; }

        .text-accent { color: var(--accent); }
        .text-secondary { color: var(--text-secondary); }
        .text-tertiary { color: var(--text-tertiary); }
        .font-mono { font-family: var(--font-mono); }
        .font-serif { font-family: var(--font-serif); }
        .font-sans { font-family: var(--font-sans); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 500;
            font-size: 0.875rem;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
            transform: translateY(-1px);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        /* Cards and surfaces */
        .surface {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: none;
        }

        .surface:hover {
            border-color: var(--border-light);
        }

        .eyebrow {
            color: var(--accent);
            font: 500 0.75rem/1.4 var(--font-mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(16rem, 0.8fr);
            gap: 4rem;
            align-items: end;
            padding: 3rem 0 4rem;
            border-bottom: 1px solid var(--border);
        }

        .hero-title { font-size: clamp(2.7rem, 7vw, 5.5rem); max-width: 12ch; }
        .hero-summary { font-size: 1.2rem; line-height: 1.65; max-width: 39rem; }
        .signal-panel { border-top: 2px solid var(--text-primary); padding-top: 1rem; }
        .signal-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        .signal-row span:last-child { font-family: var(--font-mono); font-size: 0.75rem; text-align: right; }

        .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
        .section-heading h2 { font-size: clamp(1.7rem, 3vw, 2.25rem); }
        .case-study { border-top: 2px solid var(--text-primary); padding: 1.5rem 0 2.25rem; }
        .case-study + .case-study { margin-top: 1rem; }
        .case-study-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(16rem, 0.75fr); gap: 3rem; }
        .case-number { color: var(--accent); font: 500 0.8rem var(--font-mono); letter-spacing: 0.08em; }
        .case-metric { border-left: 2px solid var(--accent); padding-left: 1rem; margin-bottom: 1.25rem; }
        .case-metric strong { display: block; font: 600 2rem/1 var(--font-mono); color: var(--accent); }
        .case-meta { font-size: 0.875rem; color: var(--text-secondary); }

        .architecture { background: var(--bg-tertiary); border: 1px solid var(--border); padding: 1.25rem; margin-top: 1.5rem; }
        .architecture-title { font: 500 0.7rem var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 1rem; }
        .pipeline { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .pipeline span { background: var(--bg-secondary); border: 1px solid var(--border-light); padding: 0.45rem 0.55rem; font: 0.72rem var(--font-mono); }
        .pipeline i { color: var(--accent); font-style: normal; }

        .note { border-left: 2px solid var(--signal); background: #fff8f2; padding: 1rem 1.25rem; color: #7c2d12; font-size: 0.875rem; }

        /* Accent border */
        .accent-border {
            border-left: 3px solid var(--accent);
            padding-left: 1.5rem;
        }

        /* Tags */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 9999px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Footer */
        footer {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 2rem 0;
        }

        footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer p {
            color: var(--text-tertiary);
            font-size: 0.875rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
        }

        .social-links a {
            color: var(--text-tertiary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: var(--accent);
        }

        /* Utilities */
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .gap-8 { gap: 2rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .w-full { width: 100%; }
        .hidden { display: none; }

        /* Spacing utilities */
        .space-y-4 > * + * { margin-top: 1rem; }
        .space-y-6 > * + * { margin-top: 1.5rem; }
        .space-y-8 > * + * { margin-top: 2rem; }
        .space-y-12 > * + * { margin-top: 3rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-8 { margin-top: 2rem; }
        .mt-12 { margin-top: 3rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-12 { margin-bottom: 3rem; }

        @media (min-width: 768px) {
            .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .md\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .md\:flex { display: flex; }
            .md\:flex-row { flex-direction: row; }
            .md\:items-center { align-items: center; }
            .md\:items-start { align-items: flex-start; }
            .md\:justify-between { justify-content: space-between; }
            .md\:hidden { display: none; }
        }

        /* Form elements */
        input, textarea {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            font-family: var(--font-sans);
            font-size: 0.875rem;
            width: 100%;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Responsive nav */
        @media (max-width: 640px) {
            nav .container { height: auto; min-height: 4rem; flex-wrap: wrap; }
            .nav-toggle { display: block; }
            .nav-links { display: none; width: 100%; flex-direction: column; gap: 0; padding: 0 0 0.75rem; }
            .nav-links.is-open { display: flex; }
            .nav-links li { border-top: 1px solid var(--border); }
            .nav-links a { display: block; padding: 0.65rem 0; }
            .nav-links a::after { display: none; }
            .hero { grid-template-columns: 1fr; gap: 2.5rem; padding-top: 1rem; }
            .case-study-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .section-heading { align-items: flex-start; flex-direction: column; }
            h1 { font-size: 2.25rem; }
            h2 { font-size: 1.5rem; }
            footer .container { align-items: flex-start; flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="nav-brand">Harshil Agrawal</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">Menu</button>
            <ul class="nav-links" id="primary-navigation">
                <li><a href="/">Home</a></li>
                <li><a href="/projects">Projects</a></li>
                <li><a href="/demo">ML Demo</a></li>
                <li><a href="/resume">Resume</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Harshil Agrawal. Built with FastAPI.</p>
            <div class="social-links">
                <a href="https://github.com/Harshil411" target="_blank">GitHub</a>
                <a href="mailto:harshilsagrawal@gmail.com">Email</a>
            </div>
        </div>
    </footer>
    <script>
        const navToggle = document.querySelector('.nav-toggle');
        const navLinks = document.querySelector('.nav-links');
        navToggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('is-open');
            navToggle.setAttribute('aria-expanded', isOpen);
            navToggle.textContent = isOpen ? 'Close' : 'Menu';
        });
    </script>
</body>
</html>
