<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Harshil Agrawal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="text-xl font-bold text-gray-900">Harshil Agrawal</a>
                <div class="hidden sm:flex space-x-8">
                    <a href="/" class="text-gray-600 hover:text-gray-900 transition">Home</a>
                    <a href="/projects" class="text-gray-600 hover:text-gray-900 transition">Projects</a>
                    <a href="/demo" class="text-gray-600 hover:text-gray-900 transition">ML Demo</a>
                    <a href="/resume" class="text-gray-600 hover:text-gray-900 transition">Resume</a>
                    <a href="/blog" class="text-gray-600 hover:text-gray-900 transition">Blog</a>
                    <a href="/contact" class="text-gray-600 hover:text-gray-900 transition">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t mt-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-gray-500 text-sm">
            &copy; 2026 Harshil Agrawal. Built with FastAPI.
        </div>
    </footer>
</body>
</html>
